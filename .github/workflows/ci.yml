# Typecheck, unit tests, browser end-to-end tests, Python tests and the repository
# guards (no media in git, permissive shipped dependencies). Actions are pinned by SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:media
      - run: npm run check:licenses
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e '.[dev]'
      # CPU-only torch for the quick fine-tune test; the PyPI build would pull in gigabytes of CUDA.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pytest -q
      - run: python -m rifteye_ml.spike demo --cards 24 --heights 40,120 --bitrates 2000 --out /tmp/m0-demo.csv
